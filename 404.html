<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página no encontrada | Juan Israel Flores</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #F3F4F6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            max-width: 500px;
        }
        .error-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 120px;
            font-weight: 700;
            background: linear-gradient(135deg, #7E7BE6, #34D399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 10px;
        }
        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 15px;
            color: #6B7280;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        .btn-primary {
            background: #111827;
            color: #fff;
        }
        .btn-primary:hover {
            background: #7E7BE6;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #fff;
            color: #111827;
            border: 1px solid #E5E7EB;
        }
        .btn-secondary:hover {
            border-color: #7E7BE6;
            color: #7E7BE6;
        }
        .error-illustration {
            font-size: 64px;
            margin-bottom: 20px;
        }
        @media (max-width: 480px) {
            .error-code { font-size: 80px; }
            .error-title { font-size: 20px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="error-container">
        <div class="error-illustration">🔍</div>
        <div class="error-code">404</div>
        <h1 class="error-title">Página no encontrada</h1>
        <p class="error-desc">
            Parece que te perdiste en el código. La página que buscás no existe o fue movida a otra URL.
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">← Volver al inicio</a>
            <a href="mailto:juanmks86@gmail.com" class="btn btn-secondary">Contactar</a>
        </div>
    </div>
</body>
</html>
